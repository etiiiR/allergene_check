services:
  surrealdb:
    image: surrealdb/surrealdb:latest
    user: "0:0"
    command:
      - start
      - --user
      - ${SURREALDB_USER:-root}
      - --pass
      - ${SURREALDB_PASS:-root}
      - rocksdb:/data/database.db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - surrealdb-data:/data
    healthcheck:
      test: ["CMD", "/surreal", "isready", "--endpoint", "http://localhost:8000"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  app:
    build:
      context: .
    depends_on:
      surrealdb:
        condition: service_healthy
    environment:
      PORT: "3000"
      LISTEN_HOST: "0.0.0.0"
      APP_URL: http://localhost:3000
      ML_SERVICE_URL: http://ml-service:8000
      SURREALDB_URL: ws://surrealdb:8000/rpc
      SURREALDB_NAMESPACE: ${SURREALDB_NAMESPACE:-main}
      SURREALDB_DATABASE: ${SURREALDB_DATABASE:-main}
      SURREALDB_USER: ${SURREALDB_USER:-root}
      SURREALDB_PASS: ${SURREALDB_PASS:-root}
    ports:
      - "127.0.0.1:3000:3000"

  ml-service:
    build:
      context: ./ml-service
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health')
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  surrealdb-data:
