[project]
name = "gutfeeling-ml-service"
version = "0.1.0"
description = "Local recipe importing and exploratory diary analysis service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "beautifulsoup4>=4.12,<5.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "nltk>=3.9,<4.0",
  "numpy>=2.0,<3.0",
  "pydantic>=2.10,<3.0",
  "scikit-learn>=1.7,<2.0",
  "torch==2.14.0+cpu; sys_platform == 'linux'",
  "torch==2.14.0; sys_platform != 'linux'",
  "transformers>=4.45,<5.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = ["pytest>=8.0,<9.0"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
